[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo"
version = "0.1.0"
description = "AlphaBench-EA factor discovery and AlphaMining-aligned evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    # CLI
    "click>=8.0",
    "rich>=13.0",
    # Config
    "pyyaml>=6.0",
    # Server process management
    "psutil>=5.9",
    # HTTP client
    "requests>=2.28",
    # Flask server (backend)
    "flask>=2.3",
    "gunicorn>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]
research = [
    "pyqlib",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "zss",
    "openai",
    "jsonschema",
    "tqdm",
    "matplotlib",
]

[project.scripts]
ppo = "ffo.cli.main:cli"

[tool.setuptools.packages.find]
# Install every package needed by the EA pipeline in editable or wheel installs.
include = ["ffo*", "searcher*", "agent*", "factors*"]
namespaces = true

[tool.setuptools.package-data]
ffo = [
    "config/ffo.yaml",
]
"factors.lib.alpha158" = ["*.json"]
