# AlphaBench-EA protocol aligned with ../alpha_mining.
# Search and validation never read the test segment. Test is reserved for the
# explicit public library-comparison command.

savedir: "./runs/T3/alphabench_ea_alphamining_csi300"

searching:
  algo:
    name: ea
    seed_file: "searcher/seed_factors.json"
    param:
      rounds: 10
      N: 30
      mutation_rate: 0.5
      crossover_rate: 0.5
      pool_size: 50
      seeds_top_k: 16
      enable_reason: true
  model:
    name: "deepseek-chat"
    base_url: "https://api.deepseek.com"
    key: "${DEEPSEEK_API_KEY}"
    temperature: 0.7

backtesting:
  ffo_server: "127.0.0.1:19777"
  market: "csi300"
  benchmark: "SH000300"
  fields: [open, high, low, close, volume, vwap]
  search_start: "2010-01-01"
  search_end: "2019-11-30"
  label: "open_to_open_10d"
  target_expression: "Ref($open, -11) / Ref($open, -1) - 1"
  forward_n: 1
  top_k: 50
  n_drop: 5
  account: 100000000
  deal_price: "open"
  open_cost: 0.0005
  close_cost: 0.0015
  min_cost: 5
  limit_threshold: 0.095
  fast: true
  n_jobs: 8
  timeout: 900
  # EA evaluates large train/validation batches once; persistent SQLite
  # caching adds write contention without benefiting this fixed run.
  use_cache: false
  accept_threshold: 0.0

verification:
  enabled: true
  auto_verify: true
  search_start: "2010-01-01"
  search_end: "2019-11-30"
  val_start: "2020-01-01"
  val_end: "2021-11-30"
  test_start: "2022-01-01"
  test_end: "2025-12-31"
  verification_forward_n: 1
  test_policy: "public_only"

ruler:
  estimator: "ridge"
  alpha: 10.0
  fit_intercept: false

export:
  enabled: true
  directory: "factor_library"
  source: "alphabench_ea"
